<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOT MOT - Walking Tours</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        
        :root { 
            --orange: #DE4F32; 
            --teal: #87C5C8; 
            --gold: #F59E0B; /* Color especial para los Free Tours */
            --dark: #020617;
            --scroll-bob: 0px; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark); 
            color: white; 
            margin: 0; 
            overflow: hidden; 
        }

        .font-trek { font-family: 'Syncopate', sans-serif; }
        
        .main-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        @media (min-width: 1024px) { .main-container { flex-direction: row; } }
        
        .map-section { 
            height: 45vh;
            width: 100%; 
            position: relative; 
            background: #EBE5D9; 
            flex-shrink: 0;
            overflow: hidden;
        }
        @media (min-width: 1024px) { 
            .map-section { height: 100vh; width: 50%; border-right: 1px solid rgba(255,255,255,0.1); } 
        }
        
        .content-section { 
            flex-grow: 1; 
            overflow-y: auto; 
            scroll-snap-type: y mandatory; 
            background: var(--dark);
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .content-section::-webkit-scrollbar { display: none; }

        .stage-card { 
            scroll-snap-align: start; 
            min-height: 55vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 2rem;
            position: relative;
        }
        @media (min-width: 1024px) { .stage-card { min-height: 100vh; padding: 10% 12%; } }

        .guide-scroll {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--orange) rgba(255,255,255,0.1);
        }

        .active-glow { filter: drop-shadow(0 0 6px rgba(222, 79, 50, 0.7)); }
        
        .path-draw {
            stroke-dasharray: 100;
            transition: stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
        }

        .fade-up { transition: all 0.8s ease-out; }
        .is-hidden { opacity: 0; transform: translateY(30px); filter: blur(5px); }
        .is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        
        .route-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* 1. MAPA BASE CON BUCARAMANGA INCLUIDA */
        const places = {
            'bucaramanga': { id: 'bucaramanga', title: "Bucaramanga", alt: 959, mapX: 45, mapY: 8, anchor: "start", labelX: 4, labelY: 1 },
            'zapatoca': { id: 'zapatoca', title: "Zapatoca", alt: 1787, mapX: 38, mapY: 28, anchor: "middle", labelY: -5, labelX: 0 },
            'guane': { id: 'guane', title: "Guane", alt: 885, mapX: 42, mapY: 65, anchor: "end", labelX: -4, labelY: 2 },
            'barichara': { id: 'barichara', title: "Barichara", alt: 1336, mapX: 52, mapY: 75, anchor: "middle", labelY: 7, labelX: 0 }
        };

        /* 2. CATÁLOGO DE PRODUCTOS DE WALKING TOURS */
        // Nota: Los paths SVG (pathString) ahora dibujan "bucles" alrededor del pueblo para simbolizar un recorrido local urbano.
        const walkingProducts = {
            'buca-fwt': {
                name: "Free Walking Tour Bucaramanga",
                type: "FREE TOUR",
                isFree: true,
                pathString: "M 45 8 C 38 2, 52 2, 49 12 C 45 15, 38 12, 45 8", 
                nodes: [
                    { ...places['bucaramanga'], subtitle: "Punto de Encuentro", dist: "0 km", diff: "Baja", path: "Urbano", desc: "Inicio en el corazón de la ciudad bonita.", fullText: "Nos encontramos en el parque principal para comenzar nuestra inmersión en la historia bumanguesa." },
                    { ...places['bucaramanga'], subtitle: "Ruta de los Parques", dist: "3.5 km", diff: "Baja", path: "Urbano", desc: "Arquitectura, parques y sabor local.", fullText: "Caminaremos por la zona céntrica, descubriendo anécdotas de sus parques emblemáticos, patrimonio arquitectónico y finalizando con recomendaciones de gastronomía local. Este es un recorrido basado en aporte voluntario (tips)." }
                ]
            },
            'buca-wt': {
                name: "Walking Tour Bucaramanga (Privado)",
                type: "TOUR CULTURAL",
                isFree: false,
                pathString: "M 45 8 C 38 2, 52 2, 49 12 C 45 15, 38 12, 45 8",
                nodes: [
                    { ...places['bucaramanga'], subtitle: "Tu Guía Privado", dist: "0 km", diff: "Baja", path: "Urbano", desc: "Un recorrido exclusivo a tu ritmo.", fullText: "Tu guía experto te espera para iniciar un recorrido hecho a tu medida." },
                    { ...places['bucaramanga'], subtitle: "Secretos Bumangueses", dist: "4.0 km", diff: "Baja", path: "Urbano / Museos", desc: "Historia profunda y degustación.", fullText: "Un tour completo que puede incluir ingresos a museos, degustación de café local y una narrativa profunda sobre el desarrollo comercial y cultural de Santander." }
                ]
            },
            'zapa-wt': {
                name: "Walking Tour Zapatoca",
                type: "TOUR HISTÓRICO",
                isFree: false,
                pathString: "M 38 28 C 32 22, 44 22, 41 33 C 38 35, 32 32, 38 28",
                nodes: [
                    { ...places['zapatoca'], subtitle: "Plaza Central", dist: "0 km", diff: "Baja", path: "Calles Empedradas", desc: "El clima de seda nos da la bienvenida.", fullText: "Nos reunimos frente a la imponente iglesia de tapia pisada." },
                    { ...places['zapatoca'], subtitle: "Ciudad Levítica", dist: "2.5 km", diff: "Baja", path: "Urbano Patrimonial", desc: "Misticismo, Lengerke y casonas.", fullText: "Exploraremos el impacto del alemán Geo von Lengerke, la arquitectura de las casonas coloniales y el encanto de los miradores locales cercanos al casco urbano." }
                ]
            },
            'bari-fwt': {
                name: "Free Walking Tour Barichara",
                type: "FREE TOUR",
                isFree: true,
                pathString: "M 52 75 C 45 68, 59 68, 56 80 C 52 83, 45 80, 52 75",
                nodes: [
                    { ...places['barichara'], subtitle: "Parque Principal", dist: "0 km", diff: "Baja", path: "Piedra Viva", desc: "Punto de encuentro en el paraíso.", fullText: "Bajo la sombra de los árboles milenarios del parque principal, iniciamos la magia." },
                    { ...places['barichara'], subtitle: "Pueblito Más Lindo", dist: "3.0 km", diff: "Baja", path: "Urbano Empedrado", desc: "Talla en piedra, miradores e historia.", fullText: "Caminaremos por sus fotogénicas calles, visitaremos capillas emblemáticas, el mirador del Cañón del Suárez y aprenderemos sobre el oficio de los canteros. Al final, tu aporte voluntario valora el trabajo de los guías locales." }
                ]
            },
            'bari-wt': {
                name: "Walking Tour Barichara (Experiencia Completa)",
                type: "TOUR PREMIUM",
                isFree: false,
                pathString: "M 52 75 C 45 68, 59 68, 56 80 C 52 83, 45 80, 52 75",
                nodes: [
                    { ...places['barichara'], subtitle: "Inicio Premium", dist: "0 km", diff: "Baja", path: "Piedra Viva", desc: "Atención personalizada.", fullText: "Encuentro en tu alojamiento o plaza principal." },
                    { ...places['barichara'], subtitle: "Inmersión Cultural", dist: "4.0 km", diff: "Baja", path: "Urbano / Talleres", desc: "Arte, papel y saberes ancestrales.", fullText: "A diferencia del tour estándar, esta experiencia puede profundizar en la visita a talleres de tapia pisada, fábricas de papel de fique y degustaciones exclusivas de la gastronomía patiamarilla." }
                ]
            }
        };

        const App = () => {
            const [selectedProductId, setSelectedProductId] = useState('buca-fwt');
            const [activeIndex, setActiveIndex] = useState(0); 
            const [showModal, setShowModal] = useState(null);
            const scrollRef = useRef(null);

            const activeProduct = walkingProducts[selectedProductId];
            const routeNodes = activeProduct.nodes;

            useEffect(() => {
                setActiveIndex(0);
                if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
            }, [selectedProductId]);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                setActiveIndex(parseInt(entry.target.dataset.index));
                            }
                        });
                    }, { threshold: 0.5, rootMargin: "-10% 0px -10% 0px" }
                );
                document.querySelectorAll('.stage-card').forEach(card => observer.observe(card));
                return () => observer.disconnect();
            }, [selectedProductId]);

            useEffect(() => { lucide.createIcons(); }, [activeIndex, showModal, selectedProductId]);

            const handleScroll = (e) => {
                const scrollTop = e.target.scrollTop;
                const bobbing = Math.sin(scrollTop * 0.04) * 1.5; 
                document.documentElement.style.setProperty('--scroll-bob', `${bobbing}px`);
            };

            const activeMapNodeIndex = Math.min(Math.max(0, activeIndex - 1), routeNodes.length - 1);
            const activeMapNode = routeNodes[activeMapNodeIndex];

            // Paneo de cámara
            const panX = (50 - activeMapNode.mapX) * 0.15;
            const panY = (50 - activeMapNode.mapY) * 0.15;

            // ALTIMETRÍA PLANA PARA WALKING TOURS
            const generateChartPath = () => {
                const alt = activeMapNode.alt;
                const y = 20 - ((alt - 400) / 1400) * 19;
                return `M 0 20 L 0 ${y} L 100 ${y} L 100 20 Z`;
            };
            
            const activeChartX = activeMapNodeIndex === 0 ? 10 : 90; // Mueve la bolita un poco para indicar "avance"
            const activeChartY = 20 - ((activeMapNode.alt - 400) / 1400) * 19;

            return (
                <div className="main-container">
                    
                    {/* IZQUIERDA: MAPA */}
                    <div className="map-section shadow-[20px_0_40px_rgba(0,0,0,0.3)]">
                        <div className="absolute top-6 left-6 z-30">
                            <h1 className="font-trek text-[#DE4F32] text-2xl tracking-tighter">MOT MOT</h1>
                            <p className="text-slate-800 text-[10px] font-black uppercase tracking-widest mt-1">Walking Tours Urbanos</p>
                        </div>

                        <svg viewBox="-10 -10 120 120" className="w-full h-full z-10 absolute inset-0 pt-8 pb-4">
                            <g style={{ 
                                transform: `translate(${panX}px, calc(${panY}px + var(--scroll-bob))) scale(1.05)`, 
                                transition: 'transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)',
                                transformOrigin: 'center'
                            }}>
                                
                                {/* FONDO PUNTOS */}
                                {Object.values(places).map((p) => (
                                    <circle key={`bg-${p.id}`} cx={p.mapX} cy={p.mapY} r="0.8" fill="#94a3b8" opacity="0.3" />
                                ))}

                                {/* RUTA CIRCULAR ACTIVA */}
                                <path 
                                    d={activeProduct.pathString} 
                                    fill="none" 
                                    stroke={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} 
                                    strokeWidth="0.8" 
                                    strokeDasharray="1.5 1.5"
                                    className="path-draw"
                                    style={{ opacity: activeIndex > 0 ? 1 : 0, strokeDashoffset: activeIndex > 1 ? '0' : '100' }}
                                />

                                {/* NODO DE LA CIUDAD */}
                                {routeNodes.map((node, i) => {
                                    const isCurrentNode = i === activeMapNodeIndex && activeIndex > 0;
                                    const isNodeDrawn = activeIndex > i;

                                    // Solo dibujamos la ciudad una vez en el mapa aunque haya 2 tarjetas
                                    if (i > 0) return null; 

                                    return (
                                        <g key={node.id} style={{ opacity: isNodeDrawn ? 1 : 0, transition: 'opacity 0.5s ease' }}>
                                            <circle 
                                                cx={node.mapX} cy={node.mapY} 
                                                r={isCurrentNode ? "2.5" : "1.5"} 
                                                fill={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} 
                                                className={`transition-all duration-700 ${isCurrentNode ? 'active-glow' : ''}`}
                                            />
                                            {isCurrentNode && (
                                                <circle cx={node.mapX} cy={node.mapY} r="4" fill={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} className="animate-ping opacity-30" />
                                            )}
                                            <text 
                                                x={node.mapX + node.labelX} 
                                                y={node.mapY + node.labelY} 
                                                textAnchor={node.anchor}
                                                className={`text-[3.5px] font-black uppercase tracking-tighter transition-all duration-700 ${isCurrentNode ? 'fill-slate-900 scale-100 opacity-100' : 'fill-slate-500 scale-95 opacity-70'}`}
                                                style={{ textShadow: '0px 0px 3px rgba(235, 229, 217, 1), 0px 0px 5px rgba(235, 229, 217, 1)' }}
                                            >
                                                {node.title}
                                            </text>
                                        </g>
                                    );
                                })}
                            </g>
                        </svg>

                        {/* ALTIMETRÍA Y HUD */}
                        <div className="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-[#EBE5D9] via-[#EBE5D9]/90 to-transparent z-40">
                            <div className="flex justify-between items-end mb-2">
                                <div>
                                    <p className="text-[10px] font-trek text-slate-500 mb-1 uppercase">Altitud Promedio</p>
                                    <span className="text-3xl md:text-4xl font-black text-slate-900">{activeMapNode.alt}</span>
                                    <span className="text-xs md:text-sm ml-1 text-slate-600 font-normal">msnm</span>
                                </div>
                                <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded-full text-[7px] md:text-[9px] font-black uppercase tracking-wider transition-colors duration-500 bg-teal-50 text-teal-700 border border-teal-100`}>
                                    Clima Urbano
                                </div>
                            </div>
                            
                            <div className="h-10 md:h-14 w-full relative">
                                <svg viewBox="0 0 100 20" preserveAspectRatio="none" className="w-full h-full opacity-30 drop-shadow-md">
                                    <path d={generateChartPath()} fill={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} />
                                    <line x1={activeChartX} y1="0" x2={activeChartX} y2="20" stroke={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} strokeWidth="0.8" strokeDasharray="1.5" className="transition-all duration-700 ease-in-out" />
                                    <circle cx={activeChartX} cy={activeChartY} r="1.5" fill={activeProduct.isFree ? "#F59E0B" : "#DE4F32"} className="transition-all duration-700 ease-in-out" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    {/* DERECHA: CONTENIDO NARRATIVO */}
                    <div className="content-section" ref={scrollRef} onScroll={handleScroll}>
                        
                        {/* TARJETA 0: SELECTOR */}
                        <section data-index={0} className="stage-card">
                            <div className={`fade-up ${activeIndex === 0 ? 'is-visible' : 'is-hidden'}`}>
                                <h3 className="text-[#DE4F32] font-trek text-xs tracking-[0.4em] mb-4">DESCUBRE</h3>
                                <h2 className="text-4xl sm:text-5xl md:text-6xl font-black uppercase leading-none tracking-tighter mb-4 break-words text-white">
                                    WALKING TOURS
                                </h2>
                                <p className="text-[#87C5C8] font-bold text-xs sm:text-sm uppercase tracking-[0.2em] mb-8">Cultura, Historia y Arquitectura</p>
                                
                                <p className="text-lg sm:text-xl text-slate-300 leading-relaxed font-light mb-8">
                                    Explora a pie las calles, los parques y los secretos mejor guardados de las ciudades y pueblos más emblemáticos de Santander, de la mano de guías locales apasionados.
                                </p>

                                <div className="bg-white/5 p-5 rounded-2xl border border-white/10 shadow-lg backdrop-blur-sm relative">
                                    <label className="text-[10px] text-slate-400 uppercase font-black tracking-widest block mb-3">Selecciona tu Destino:</label>
                                    <div className="relative">
                                        <select
                                            className="w-full bg-[#020617] text-white border border-white/20 p-4 rounded-xl font-bold text-sm outline-none focus:border-[#DE4F32] transition-colors route-select cursor-pointer shadow-inner"
                                            value={selectedProductId}
                                            onChange={(e) => setSelectedProductId(e.target.value)}
                                        >
                                            <optgroup label="Bucaramanga">
                                                <option value="buca-fwt">Free Walking Tour Bucaramanga (Aporte Voluntario)</option>
                                                <option value="buca-wt">Walking Tour Privado Bucaramanga</option>
                                            </optgroup>
                                            <optgroup label="Barichara">
                                                <option value="bari-fwt">Free Walking Tour Barichara (Aporte Voluntario)</option>
                                                <option value="bari-wt">Walking Tour Privado Barichara</option>
                                            </optgroup>
                                            <optgroup label="Zapatoca">
                                                <option value="zapa-wt">Walking Tour Histórico Zapatoca</option>
                                            </optgroup>
                                        </select>
                                    </div>
                                    <p className="text-[#DE4F32] font-trek text-[9px] tracking-widest mt-4 text-center">HAZ SCROLL PARA INICIAR EL RECORRIDO ↓</p>
                                </div>
                            </div>
                        </section>

                        {/* TARJETAS DINÁMICAS (Encuentro y Recorrido) */}
                        {routeNodes.map((node, i) => {
                            const domIndex = i + 1;
                            const isOrigin = i === 0;
                            const themeColor = activeProduct.isFree ? "text-amber-500" : "text-[#DE4F32]";
                            return (
                                <section key={`${selectedProductId}-${node.id}-${i}`} data-index={domIndex} className="stage-card">
                                    <div className={`fade-up ${activeIndex === domIndex ? 'is-visible' : 'is-hidden'}`}>
                                        
                                        <div className="flex items-center gap-4 mb-4">
                                            <span className={`${themeColor} font-trek text-xs tracking-[0.4em]`}>
                                                {isOrigin ? '01. EL ENCUENTRO' : '02. EL RECORRIDO'}
                                            </span>
                                            <div className="h-px w-full bg-white/10"></div>
                                        </div>
                                        
                                        <h2 className="text-4xl sm:text-5xl md:text-6xl font-black uppercase leading-none tracking-tighter mb-4 break-words">
                                            {node.subtitle}
                                        </h2>
                                        
                                        {activeProduct.isFree && isOrigin ? (
                                            <p className="text-amber-500 font-bold text-xs sm:text-sm uppercase tracking-[0.2em] mb-8 bg-amber-500/10 inline-block px-3 py-1 rounded border border-amber-500/20 w-max">
                                                ★ Aporte Voluntario (Tips-based)
                                            </p>
                                        ) : (
                                            <p className="text-[#87C5C8] font-bold text-xs sm:text-sm uppercase tracking-[0.2em] mb-8">{node.title}</p>
                                        )}

                                        {!isOrigin && (
                                            <div className="flex gap-6 sm:gap-8 mb-10 overflow-x-auto pb-2">
                                                <div className="flex-shrink-0">
                                                    <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Distancia Aprox</p>
                                                    <p className="text-base sm:text-lg font-bold text-white">{node.dist}</p>
                                                </div>
                                                <div className="flex-shrink-0">
                                                    <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Dificultad</p>
                                                    <p className={`text-base sm:text-lg font-bold ${themeColor}`}>{node.diff}</p>
                                                </div>
                                                <div className="flex-shrink-0">
                                                    <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Entorno</p>
                                                    <p className="text-base sm:text-lg font-bold text-white">{node.path}</p>
                                                </div>
                                            </div>
                                        )}

                                        <p className="text-lg sm:text-xl md:text-2xl text-slate-300 leading-relaxed font-light mb-10 italic">
                                            "{node.desc}"
                                        </p>

                                        <button 
                                            onClick={() => setShowModal(node)}
                                            className="group flex items-center gap-4 border border-white/20 px-6 py-3 sm:px-8 sm:py-4 rounded-full hover:bg-white hover:text-black transition-all w-max"
                                        >
                                            <span className="text-[10px] font-trek tracking-widest">VER DETALLES CULTURALES</span>
                                            <i data-lucide="info" className="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                                        </button>
                                    </div>
                                </section>
                            );
                        })}
                        
                        {/* SECCIÓN DE CIERRE (Reserva) */}
                        <section data-index={routeNodes.length + 1} className="stage-card min-h-[100vh] flex flex-col items-center justify-center gap-6 text-center">
                            <div className={`fade-up ${activeIndex === routeNodes.length + 1 ? 'is-visible' : 'is-hidden'} w-full flex flex-col items-center`}>
                                <div className="h-px w-24 bg-white/20 mb-4"></div>
                                <h3 className="text-3xl md:text-4xl font-black uppercase tracking-tighter text-white">Asegura tu Cupo</h3>
                                <p className="text-slate-400 text-sm md:text-base max-w-md mx-auto mb-4">
                                    Has explorado la ruta <strong>{activeProduct.name}</strong>. {activeProduct.isFree ? "Los cupos para nuestros Free Tours son limitados. ¡Reserva gratis ahora y apoya al guía con tu propina al final!" : "Reserva tu experiencia privada con nuestros guías expertos locales."}
                                </p>
                                
                                <button className={`group ${activeProduct.isFree ? 'bg-amber-500 hover:text-amber-500 shadow-[0_0_30px_rgba(245,158,11,0.3)]' : 'bg-[#DE4F32] hover:text-[#DE4F32] shadow-[0_0_30px_rgba(222,79,50,0.3)]'} text-white px-8 py-4 rounded-full font-bold uppercase tracking-widest hover:bg-white transition-all flex items-center justify-center gap-3 hover:shadow-[0_0_40px_rgba(255,255,255,0.4)] scale-100 hover:scale-105 w-full sm:w-auto`}>
                                    <span className="font-trek text-[9px] md:text-[10px]">RESERVAR EN AMELIA</span>
                                    <i data-lucide="calendar-check" className="w-4 h-4 group-hover:rotate-12 transition-transform"></i>
                                </button>
                            </div>
                        </section>
                    </div>

                    {/* MODAL DE INFORMACIÓN */}
                    {showModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl" onClick={() => setShowModal(null)}>
                            <div className="bg-slate-900 border border-white/10 w-full max-w-2xl rounded-[2rem] sm:rounded-[3rem] p-6 sm:p-8 md:p-12 relative shadow-2xl" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowModal(null)} className="absolute top-4 right-4 sm:top-8 sm:right-8 text-slate-500 hover:text-white transition-colors">
                                    <i data-lucide="x" className="w-6 h-6 sm:w-8 sm:h-8"></i>
                                </button>
                                <h3 className={`font-trek text-[10px] mb-4 tracking-[0.3em] ${activeProduct.isFree ? 'text-amber-500' : 'text-[#DE4F32]'}`}>BITÁCORA URBANA</h3>
                                <h2 className="text-3xl sm:text-4xl font-black uppercase mb-6 sm:mb-8 pr-10">{showModal.subtitle}</h2>
                                <p className="text-slate-300 text-base sm:text-lg md:text-xl leading-relaxed mb-8 sm:mb-10 italic">"{showModal.fullText}"</p>
                                
                                {activeProduct.isFree && (
                                    <div className="bg-amber-500/10 p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-amber-500/20 mb-4">
                                        <p className="text-amber-500 text-[10px] font-trek mb-2 tracking-widest">SOBRE EL FREE TOUR</p>
                                        <p className="text-xs sm:text-sm text-slate-300">Este recorrido no tiene un precio fijo. Al finalizar, eres libre de valorar económicamente el trabajo y pasión de tu guía según tu satisfacción y presupuesto.</p>
                                    </div>
                                )}
                                
                                <div className="bg-white/5 p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-white/5">
                                    <p className="text-[#87C5C8] text-[10px] font-trek mb-2 tracking-widest">RECOMENDACIONES</p>
                                    <p className="text-xs sm:text-sm text-slate-400">Ropa cómoda, calzado apto para caminar en ciudad/empedrado, protector solar, cámara fotográfica y dinero en efectivo para compras locales o aportes.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
