<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mot Mot - Cañón del Chicamocha</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;400;700;900&display=swap');
        
        :root { 
            --naranja: #E65127; 
            --turquesa: #80C4C8; 
            --oscuro: #0d1117;
            --blanco: #ffffff;
        }
        
        body { 
            margin:0; 
            font-family:'Montserrat',sans-serif; 
            background:#f5f5f5; 
            overflow-x:hidden;
        }

        /* HERO */
        .hero { position:relative; width:100%; height:100vh; overflow:hidden; display:flex; align-items:flex-end; color:white; }
        .hero-bg { position:absolute; inset:0; background-image:url('https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/hero.png'); background-size:cover; background-position:76% center; transform:scale(1.02); }
        .hero-overlay { position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.62) 28%, rgba(0,0,0,0.12) 60%, rgba(0,0,0,0.02) 100%); }

        /* TOP */
        .topbar { position:absolute; top:18px; left:18px; right:18px; z-index:20; display:flex; justify-content:space-between; align-items:center; }
        .logo-top { display:flex; align-items:center; gap:12px; }
        .logo-top img { width:52px; height:52px; object-fit:contain; }
        
        .login-btn { background:rgba(255,255,255,0.10); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.12); color:white; padding:10px 16px; border-radius:16px; text-decoration:none; font-weight:700; font-size:0.78rem; transition:0.3s; }
        .login-btn:hover { background:rgba(255,255,255,0.18); }

        /* CONTENIDO */
        .hero-content { position:relative; z-index:5; width:100%; padding:0 24px 132px 24px; box-sizing:border-box; }
        .mot-signature { font-size:0.76rem; font-weight:800; letter-spacing:2.2px; text-transform:uppercase; color:white; border-left:2px solid var(--naranja); padding-left:12px; margin-bottom:18px; }
        .hero h1 { font-size:4.7rem; line-height:0.90; margin:0; font-weight:900; letter-spacing:-2px; text-transform:uppercase; max-width:680px; }
        .hero h1 span { color:var(--naranja); }
        .hero p { max-width:520px; font-size:1.02rem; line-height:1.6; margin-top:22px; color:rgba(255,255,255,0.88); }

        /* NAV APP */
        .bottom-app-nav { position:absolute; left:50%; transform:translateX(-50%); bottom:18px; width:92%; max-width:700px; z-index:30; }
        .bottom-nav-container { display:grid; grid-template-columns:repeat(3,1fr); background:rgba(14,16,20,0.72); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; overflow:hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
        .bottom-item { position:relative; text-align:center; padding:15px 8px 13px; cursor:pointer; transition:0.25s; }
        .bottom-item:hover { background:rgba(255,255,255,0.05); }
        .bottom-item:not(:last-child)::after { content:''; position:absolute; right:0; top:22%; width:1px; height:56%; background:rgba(255,255,255,0.08); }

        /* ICONOS Y TITULOS */
        .bottom-icon { width:42px; height:42px; margin:0 auto 8px auto; display:flex; align-items:center; justify-content:center; border-radius:14px; background:rgba(255,255,255,0.05); color:white; }
        .bottom-title { font-size:0.84rem; font-weight:800; color:white; }
        .bottom-sub { margin-top:3px; font-size:0.67rem; color:rgba(255,255,255,0.58); }

        @media(max-width:768px){
            .hero-content { padding:0 18px 120px 18px; }
            .hero h1 { font-size:2.55rem; line-height:0.93; max-width:280px; }
            .hero p { max-width:280px; font-size:0.88rem; margin-top:16px; }
            .logo-top img { width:42px; height:42px; }
            .bottom-app-nav { width:94%; bottom:12px; }
            .bottom-icon { width:34px; height:34px; border-radius:11px; margin-bottom:6px; }
            .bottom-title { font-size:0.64rem; }
            .bottom-sub { display:none; }
        }
    </style>
</head>
<body>

<header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="logo-top">
            <img src="https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/cropped-logo-foto-de-perfil-instagram-1.png">
        </div>
        <a href="https://www.motmotexperiencias.com/registro.html" class="login-btn">Ingresar</a>
    </div>

    <!-- TEXTO -->
    <div class="hero-content">
        <div class="mot-signature">Muévete • Observa • Transfórmate</div>
        <h1>CAMINATAS<br>Y EXPERIENCIAS<br><span>REALES.</span></h1>
        <p>Conectamos <strong>anfitriones, viajeros y guías</strong>. Descubre caminos auténticos con nuestra comunidad.</p>
    </div>

    <!-- MENU -->
    <div class="bottom-app-nav">
        <div class="bottom-nav-container">
            <!-- CAMINOS (Icono de Ruta) -->
            <div class="bottom-item" onclick="window.location.href='https://www.motmotexperiencias.com/caminos.html'">
                <div class="bottom-icon"><i data-lucide="route" class="w-5 h-5"></i></div>
                <div class="bottom-title">Caminos</div>
                <div class="bottom-sub">Explorar rutas</div>
            </div>
            <!-- COMUNIDAD (Icono de Usuarios) -->
            <div class="bottom-item" onclick="window.location.href='https://www.motmotexperiencias.com/registro.html'">
                <div class="bottom-icon"><i data-lucide="users" class="w-5 h-5"></i></div>
                <div class="bottom-title">Comunidad</div>
                <div class="bottom-sub">Viajeros y guías</div>
            </div>
            <!-- PERFIL (Icono de Usuario) -->
            <div class="bottom-item" onclick="window.location.href='https://www.motmotexperiencias.com/registro.html'">
                <div class="bottom-icon"><i data-lucide="user" class="w-5 h-5"></i></div>
                <div class="bottom-title">Perfil</div>
                <div class="bottom-sub">Ingresar</div>
            </div>
        </div>
    </div>
</header>

<script>
    // Inicializar iconos de Lucide
    lucide.createIcons();
</script>

</body>
</html>
