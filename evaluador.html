<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador SIG ISO 21101 - Mot Mot Experiencias</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050A15; /* Fondo oscuro igual al de Streamlit */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita doble barra de desplazamiento */
        }
        
        /* Cabecera institucional muy delgada */
        .header-motmot {
            background-color: #0A0F19;
            border-bottom: 2px solid #DE4A25;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }

        .header-motmot img {
            height: 40px;
        }

        .header-motmot h1 {
            color: #FFFFFF;
            font-size: 1.2rem;
            margin: 0;
        }

        /* Botón superior para que los auditores envíen datos sin app */
        .btn-auditar {
            background: linear-gradient(90deg, #DE4A25, #FF5A33);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-auditar:hover {
            box-shadow: 0 0 15px rgba(222, 74, 37, 0.8);
            transform: scale(1.05);
        }

        /* El contenedor de la ventana de Streamlit */
        .iframe-container {
            height: calc(100vh - 74px); /* Resta la altura de la cabecera */
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 1. Cabecera institucional de Mot Mot -->
    <div class="header-motmot">
        <img src="https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/cropped-logo-foto-de-perfil-instagram-1.png" alt="Logo Mot Mot">
        <h1>PORTAL DE AUDITORÍA INTERNA</h1>
        
        <!-- Este es el botón que abrirá el formulario de KoBoToolbox para enviar fotos sin instalar la App -->
        <a href="https://ee.kobotoolbox.org/x/ibbsQweo" target="_blank" class="btn-auditar">
            🛰️ Enviar Nuevo Registro
        </a>
    </div>

    <!-- 2. La ventana mágica (iframe) que muestra el Command Center de Streamlit -->
    <div class="iframe-container">
        <!-- Fíjate que al final del enlace le puse /?embed=true para que Streamlit oculte sus menús grises feos de arriba -->
        <iframe src="https://motmot-iso21101.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
