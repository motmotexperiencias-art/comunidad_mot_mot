<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador SIG ISO 21101 - Mot Mot Experiencias</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050A15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .header-motmot {
            background-color: #0A0F19;
            border-bottom: 2px solid #DE4A25;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            gap: 15px;
            box-sizing: border-box;
        }

        .header-motmot img {
            height: 40px;
        }

        .header-motmot h1 {
            color: #FFFFFF;
            font-size: 1.2rem;
            margin: 0;
            text-align: center;
        }

        .iframe-container {
            height: calc(100vh - 60px);
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Reglas de adaptación para dispositivos móviles */
        @media (max-width: 600px) {
            .header-motmot {
                height: 50px;
                padding: 5px 10px;
                gap: 10px;
            }
            .header-motmot img {
                height: 30px;
            }
            .header-motmot h1 {
                font-size: 0.9rem;
            }
            .iframe-container {
                height: calc(100vh - 50px);
            }
        }
    </style>
</head>
<body>

    <div class="header-motmot">
        <img src="https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/cropped-logo-foto-de-perfil-instagram-1.png" alt="Logo Mot Mot">
        <h1>PORTAL DE AUDITORÍA INTERNA</h1>
    </div>

    <div class="iframe-container">
        <iframe src="https://motmot-iso21101.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
