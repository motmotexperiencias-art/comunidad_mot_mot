<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mot Mot - Travesía Majestuosa</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@300;400;700;900&display=swap');
        
        :root { 
            --orange: #DE4F32; 
            --teal: #87C5C8; 
            --dark: #0f172a;
            --light-bg: #F8F5F0; 
            --scroll-bob: 0px; 
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
            overflow-y: hidden; 
        }

        .font-trek { font-family: 'Syncopate', sans-serif; }

        /* Estructura Principal */
        .main-container { height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }
        @media (min-width: 1024px) { .main-container { flex-direction: row; } }
        
        /* Sección Mapa */
        .map-section { 
            height: 35vh; width: 100%; position: relative; 
            background: var(--light-bg);
            flex-shrink: 0; overflow: hidden; 
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        @media (min-width: 1024px) { .map-section { height: 100%; width: 50%; border-right: 1px solid rgba(0,0,0,0.1); box-shadow: none; } }
        
        /* Sección Contenido */
        .content-wrapper {
            position: relative;
            flex-grow: 1;
            height: 65vh;
            overflow: hidden;
        }
        @media (min-width: 1024px) { .content-wrapper { height: 100%; width: 50%; } }

        /* Fondo Dinámico */
        .dynamic-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1s ease-in-out;
            z-index: 1;
        }
        .dynamic-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(2,6,23,0.4) 0%, rgba(2,6,23,0.85) 100%);
        }

        /* Scroll Container */
        .content-scroll { 
            position: relative;
            z-index: 5;
            height: 100%; 
            overflow-y: auto; 
            scroll-snap-type: y mandatory; 
            scrollbar-width: none; 
            scroll-behavior: smooth; 
        }
        .content-scroll::-webkit-scrollbar { display: none; }

        .stage-card { 
            scroll-snap-align: start; 
            min-height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 2rem 1.5rem; 
            position: relative; 
        }
        @media (min-width: 1024px) { .stage-card { padding: 4rem 10%; justify-content: center; } }

        /* Panel de Cristal */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Animaciones */
        .path-draw { stroke-dasharray: 150; transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease; }
        .fade-up { transition: all 0.8s ease-out; }
        .is-hidden { opacity: 0; transform: translateY(20px); filter: blur(4px); }
        .is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        
        .route-select {
            appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;
        }
    </style>
</head>
<body class="antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const stageImages = [
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img_20210716_060329.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img-20241017-wa0008.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img_20240620_061110.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img_20220116_091236.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img_20250927_075107.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/img_20250828_155416.jpg", 
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/80511381master.jpg",     
            "https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/brown-classic-refined-photography-website-business-proposal-presentation-4.jpg" 
        ];

        /* KILOMETRAJES CORREGIDOS EXACTOS POR ETAPA */
        const baseNodes = [
            { id: 'zapatoca', title: "Zapatoca", subtitle: "Ciudad Levítica", alt: 1787, segmentDist: 0, diff: "Básica", path: "Mixto", desc: "El legado andino y la tapia pisada.", fullText: "La aventura comienza a 1.787 msnm. Caminamos por la historia en senderos tallados por Lengerke, atravesando un bosque andino.", mapX: 38, mapY: 20, anchor: "middle", labelY: -5, labelX: 0 },
            { id: 'la-fuente', title: "La Fuente", subtitle: "Descenso al Cañón", alt: 429, segmentDist: 20, diff: "Avanzada", path: "Tierra y Roca", desc: "El impacto del descenso hacia el bosque seco.", fullText: "Un descenso continuo y técnico de 1.390 metros hacia la inmensidad árida.", mapX: 20, mapY: 58, anchor: "end", labelX: -4, labelY: 1.5 },
            { id: 'guane', title: "Guane", subtitle: "Refugio Fósil", alt: 378, segmentDist: 13.8, diff: "Avanzada", path: "Herradura", desc: "Resistencia pura a través de la aridez.", fullText: "Alta exigencia aeróbica, cruzando senderos de piedra viva hasta el silencio de Guane.", mapX: 42, mapY: 72, anchor: "end", labelX: -4, labelY: 2 },
            { id: 'barichara', title: "Barichara", subtitle: "Vía Real", alt: 1336, segmentDist: 6.2, diff: "Intermedia", path: "Piedra", desc: "El histórico ascenso por piedra amarilla.", fullText: "El Camino de Piedra Nacional. Barichara es el refugio logístico y cultural.", mapX: 52, mapY: 85, anchor: "middle", labelY: 6, labelX: 0 },
            { id: 'villanueva', title: "Villanueva", subtitle: "Ruta del Ocre", alt: 1578, segmentDist: 9, diff: "Intermedia", path: "Natural", desc: "Conectividad rural entre cultivos y naturaleza.", fullText: "Sendero de herradura y vías veredales, transitando junto a cafetales y fincas campesinas.", mapX: 68, mapY: 72, anchor: "start", labelY: 6, labelX: 3 },
            { id: 'jordan', title: "Jordán", subtitle: "El Fondo del Abismo", alt: 454, segmentDist: 15.8, diff: "Extrema", path: "Escarpado", desc: "El calor y el silencio imponen su ley.", fullText: "Descenso profundo. Temperaturas de 35°C y exposición solar total en las paredes del cañón.", mapX: 85, mapY: 55, anchor: "middle", labelX: 0, labelY: 7 },
            { id: 'los-santos', title: "Los Santos", subtitle: "El Muro", alt: 1289, segmentDist: 5.7, diff: "Extrema", path: "Vertical", desc: "Ascenso directo de 845 metros en zigzag.", fullText: "La conquista final de la travesía. Pared de pura exigencia física que requiere máxima preparación.", mapX: 75, mapY: 35, anchor: "middle", labelX: 0, labelY: -5 }
        ];

        const pathSegments = {
            'zapatoca-la-fuente': 'M 38 20 Q 30 40, 20 58', 'la-fuente-zapatoca': 'M 20 58 Q 30 40, 38 20',
            'la-fuente-guane': 'M 20 58 C 30 40, 35 60, 42 72', 'guane-la-fuente': 'M 42 72 C 35 60, 30 40, 20 58',
            'guane-barichara': 'M 42 72 Q 45 80, 52 85', 'barichara-guane': 'M 52 85 Q 45 80, 42 72',
            'barichara-villanueva': 'M 52 85 Q 60 82, 68 72', 'villanueva-barichara': 'M 68 72 Q 60 82, 52 85',
            'villanueva-jordan': 'M 68 72 Q 78 68, 85 55', 'jordan-villanueva': 'M 85 55 Q 78 68, 68 72',
            'jordan-los-santos': 'M 85 55 Q 85 45, 75 35', 'los-santos-jordan': 'M 75 35 Q 85 45, 85 55'
        };

        const MapApp = () => {
            const [routeOption, setRouteOption] = useState('full-fwd');
            const [activeIndex, setActiveIndex] = useState(0);
            const scrollRef = useRef(null);

            useEffect(() => {
                setActiveIndex(0);
                if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
            }, [routeOption]);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) setActiveIndex(parseInt(entry.target.dataset.index));
                        });
                    }, { threshold: 0.5, rootMargin: "-10% 0px -10% 0px", root: scrollRef.current }
                );
                document.querySelectorAll('.stage-card').forEach(card => observer.observe(card));
                return () => observer.disconnect();
            }, [routeOption]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [activeIndex, routeOption]);

            const getCurrentRoute = () => {
                let seq = [];
                if (routeOption === 'full-fwd') seq = baseNodes.slice();
                if (routeOption === 'half-zap-bar') seq = baseNodes.slice(0, 4);
                if (routeOption === 'half-bar-san') seq = baseNodes.slice(3, 7);

                return seq.map((node, i) => {
                    // Muestra la distancia exacta del segmento para esta etapa
                    const displayDist = node.segmentDist > 0 ? node.segmentDist.toFixed(1) + " km" : "Inicio";
                    return { ...node, dist: displayDist, displayLevel: i + 1, segmentPath: i > 0 ? pathSegments[`${seq[i-1].id}-${node.id}`] : "" };
                });
            };

            const currentRoute = getCurrentRoute();
            const activeNodeIndex = Math.min(Math.max(0, activeIndex - 1), currentRoute.length - 1);
            const activeMapNode = currentRoute[activeNodeIndex];
            
            const panX = (50 - activeMapNode.mapX) * 0.15;
            const panY = (50 - activeMapNode.mapY) * 0.15;

            const handleScroll = (e) => {
                const bobbing = Math.sin(e.target.scrollTop * 0.04) * 1.5; 
                document.documentElement.style.setProperty('--scroll-bob', `${bobbing}px`);
            };

            return (
                <div className="main-container">
                    
                    {/* IZQUIERDA: MAPA LUMINOSO */}
                    <div className="map-section">
                        <div className="absolute top-4 left-4 md:top-8 md:left-8 z-30 drop-shadow-md">
                            <img src="https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/cropped-logo-foto-de-perfil-instagram-1.png" alt="Mot Mot Logo" className="h-10 md:h-14 w-auto object-contain" />
                        </div>

                        <svg viewBox="-10 -10 120 120" className="w-full h-full z-10 absolute inset-0 pt-6 pb-24">
                            <g style={{ transform: `translate(${panX}px, calc(${panY}px + var(--scroll-bob))) scale(1.05)`, transition: 'transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)', transformOrigin: 'center' }}>
                                
                                {currentRoute.map((node, i) => <path key={`bg-${i}`} d={node.segmentPath} fill="none" stroke="rgba(135,197,200,0.6)" strokeWidth="0.5" strokeDasharray="1 1.5" />)}
                                
                                {currentRoute.map((node, i) => (
                                    <path key={`active-${i}`} d={node.segmentPath} fill="none" stroke="#87C5C8" strokeWidth="1.2" className="path-draw" style={{ opacity: i <= activeNodeIndex && activeIndex > 0 ? 1 : 0, strokeDashoffset: i <= activeNodeIndex && activeIndex > 0 ? '0' : '150' }} />
                                ))}

                                {currentRoute.map((node, i) => {
                                    const isNodeActive = i <= activeNodeIndex && activeIndex > 0;
                                    const isCurrentNode = i === activeNodeIndex && activeIndex > 0;
                                    return (
                                        <g key={node.id}>
                                            {!isCurrentNode && (
                                                <circle cx={node.mapX} cy={node.mapY} r="1.5" fill={isNodeActive ? "#DE4F32" : "#CBD5E1"} />
                                            )}
                                            
                                            {isCurrentNode && (
                                                <g transform={`translate(${node.mapX - 4}, ${node.mapY - 4})`}>
                                                    <circle cx="4" cy="4" r="5" fill="#DE4F32" className="animate-ping opacity-40" />
                                                    <image href="https://inmobiliariabarichara.wordpress.com/wp-content/uploads/2026/05/logo-caminante.png" width="8" height="8" className="drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]" />
                                                </g>
                                            )}
                                            
                                            <text x={node.mapX + node.labelX} y={node.mapY + node.labelY} textAnchor={node.anchor} className={`text-[3.2px] font-bold transition-all duration-700 ${isCurrentNode ? 'fill-slate-900 scale-100 opacity-100' : 'fill-slate-500 scale-95 opacity-70'}`}>
                                                {node.title}
                                            </text>
                                        </g>
                                    );
                                })}
                            </g>
                        </svg>

                        <div className="absolute bottom-0 left-0 w-full p-4 md:p-8 bg-gradient-to-t from-white/90 via-white/50 to-transparent z-40 flex justify-between items-end border-t border-slate-200/50 backdrop-blur-[2px]">
                            <div>
                                <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Altitud Actual</p>
                                <span className="text-3xl md:text-5xl font-black text-slate-900 leading-none">{activeMapNode.alt}</span>
                                <span className="text-sm ml-1 text-slate-600 font-bold">msnm</span>
                            </div>
                            <div className={`px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest shadow-sm border ${activeMapNode.alt < 600 ? 'bg-orange-50 text-[#DE4F32] border-orange-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                {activeMapNode.alt < 600 ? '🔥 Zona de Calor Extremo' : '🍃 Clima Andino'}
                            </div>
                        </div>
                    </div>

                    {/* DERECHA: CONTENIDO */}
                    <div className="content-wrapper">
                        
                        {stageImages.map((img, idx) => (
                            <div key={idx} className="dynamic-bg" style={{ backgroundImage: `url(${img})`, opacity: activeIndex === idx ? 1 : 0 }} />
                        ))}

                        <div className="content-scroll" ref={scrollRef} onScroll={handleScroll}>
                            
                            {/* NUEVA INTRO ESTRATÉGICA MOT MOT */}
                            <section data-index={0} className="stage-card">
                                <div className={`glass-panel fade-up ${activeIndex === 0 ? 'is-visible' : 'is-hidden'}`}>
                                    <h3 className="text-[#DE4F32] font-trek text-[10px] md:text-xs tracking-[0.2em] mb-2 drop-shadow-md">MUEVETE • OBSERVA • TRASFÓRMATE</h3>
                                    <h2 className="text-3xl sm:text-4xl md:text-5xl font-black uppercase leading-[0.9] tracking-tighter mb-4 text-white">Cañon Del<br/>Chicamocha.</h2>
                                    
                                    <div className="mb-6 space-y-3">
                                        <p className="text-sm md:text-sm text-slate-300 font-light leading-relaxed">
                                            Conectamos anfitriones, viajeros y guías. Descubre caminos auténticos con nuestra comunidad.
                                        </p>
                                    </div>
                                    
                                    <div className="bg-black/40 p-4 rounded-xl border border-white/10">
                                        <label className="text-[9px] text-[#87C5C8] uppercase font-bold tracking-widest block mb-2">SELECCIONAR RUTA:</label>
                                        <select className="w-full bg-transparent text-white border-b border-white/20 pb-2 font-bold text-sm outline-none focus:border-[#DE4F32] transition-colors route-select cursor-pointer" value={routeOption} onChange={(e) => setRouteOption(e.target.value)}>
                                            <option value="full-fwd" className="bg-slate-900">Travesía Completa (70.5 km)</option>
                                            <option value="half-zap-bar" className="bg-slate-900">Media: Zapatoca → Barichara</option>
                                            <option value="half-bar-san" className="bg-slate-900">Media: Barichara → Los Santos</option>
                                        </select>
                                    </div>
                                    <div className="mt-6 flex justify-center">
                                        <span className="text-[#DE4F32] animate-bounce bg-white/10 rounded-full p-2"><i data-lucide="arrow-down" className="w-5 h-5"></i></span>
                                    </div>
                                </div>
                            </section>

                            {/* ETAPAS */}
                            {currentRoute.map((node, i) => (
                                <section key={node.id} data-index={i+1} className="stage-card">
                                    <div className={`glass-panel fade-up ${activeIndex === i+1 ? 'is-visible' : 'is-hidden'}`}>
                                        
                                        <div className="flex items-center gap-3 mb-3">
                                            <span className="bg-[#DE4F32] text-white px-2 py-1 rounded text-[8px] font-black uppercase tracking-widest">Etapa 0{node.displayLevel}</span>
                                            <span className="text-[#87C5C8] text-[9px] font-bold uppercase tracking-widest">{node.subtitle}</span>
                                        </div>

                                        <h2 className="text-4xl sm:text-5xl md:text-6xl font-black uppercase leading-none tracking-tighter mb-6">{node.title}</h2>
                                        
                                        <div className="grid grid-cols-2 gap-3 mb-5">
                                            <div className="bg-black/40 rounded-xl p-3 border border-white/5">
                                                <p className="text-[8px] text-slate-400 uppercase font-bold tracking-widest flex items-center gap-1"><i data-lucide="route" className="w-3 h-3 text-[#DE4F32]"></i> Kilómetros</p>
                                                <p className="text-lg font-bold text-white mt-1">{node.dist}</p>
                                            </div>
                                            <div className="bg-black/40 rounded-xl p-3 border border-white/5">
                                                <p className="text-[8px] text-slate-400 uppercase font-bold tracking-widest flex items-center gap-1"><i data-lucide="mountain" className="w-3 h-3 text-[#DE4F32]"></i> Terreno</p>
                                                <p className="text-sm font-bold text-white mt-1 leading-tight">{node.path}</p>
                                            </div>
                                        </div>
                                        
                                        <p className="text-base md:text-lg text-slate-200 font-light italic mb-4 leading-relaxed">"{node.desc}"</p>
                                        <p className="text-sm text-slate-400 font-normal leading-relaxed hidden md:block pb-4 mb-4 border-b border-white/10">{node.fullText}</p>

                                        {/* BOTÓN DE INGRESO AL DESTINO (COMUNIDAD) */}
                                        <a 
                                            href={`etapa${node.displayLevel}.html`} 
                                            className="w-full flex items-center justify-between bg-white/5 border border-white/10 text-white px-5 py-4 rounded-xl hover:bg-[#DE4F32] hover:border-[#DE4F32] hover:text-white transition-all group cursor-pointer no-underline"
                                        >
                                            <div className="flex flex-col">
                                                <span className="text-xs md:text-sm font-black tracking-widest uppercase">Explorar Destino</span>
                                                <span className="text-[9px] md:text-[10px] text-slate-400 group-hover:text-white/80 uppercase tracking-widest mt-1">Guías, anfitriones y actividades</span>
                                            </div>
                                            <div className="bg-black/30 p-2 rounded-full group-hover:bg-white/20 transition-colors">
                                                <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                                            </div>
                                        </a>

                                        {/* BOTÓN DE COMPRA FINAL (Solo aparece en la última etapa de la ruta) */}
                                        {i === currentRoute.length - 1 && (
                                            <a 
                                                href="trekking.html" 
                                                className="mt-3 w-full flex items-center justify-center bg-[#DE4F32] border border-[#DE4F32] text-white px-5 py-4 rounded-xl hover:bg-white hover:text-[#DE4F32] transition-all group cursor-pointer no-underline shadow-[0_0_20px_rgba(222,79,50,0.3)]"
                                            >
                                                <span className="text-xs md:text-sm font-black tracking-widest uppercase">Comprar Travesía Majestuosa</span>
                                            </a>
                                        )}

                                    </div>
                                </section>
                            ))}

                        </div>
                    </div>
                    
                    {/* BARRA DE NAVEGACIÓN GLOBAL INFERIOR (Estilo Mot Mot) */}
                    <div className="fixed bottom-0 left-0 w-full z-50 bg-[#0f172a] border-t border-white/10 flex justify-center py-2 pb-4 px-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                        <div className="max-w-md w-full flex justify-between items-center px-2">
                            <a href="rutas.html" className="flex flex-col items-center gap-1 group no-underline text-center w-1/3">
                                <i data-lucide="git-merge" className="w-5 h-5 text-white group-hover:text-[#DE4F32] transition-colors"></i>
                                <span className="text-white font-black text-[9px] md:text-[10px] uppercase tracking-wider mt-1">Caminos</span>
                                <span className="text-[#87C5C8] text-[7px] md:text-[8px] uppercase tracking-widest">Explorar rutas</span>
                            </a>
                            
                            <div className="w-[1px] h-8 bg-white/10"></div>
                            
                            <a href="comunidad.html" className="flex flex-col items-center gap-1 group no-underline text-center w-1/3">
                                <i data-lucide="users" className="w-5 h-5 text-white group-hover:text-[#DE4F32] transition-colors"></i>
                                <span className="text-white font-black text-[9px] md:text-[10px] uppercase tracking-wider mt-1">Comunidad</span>
                                <span className="text-[#87C5C8] text-[7px] md:text-[8px] uppercase tracking-widest">Viajeros y guías</span>
                            </a>
                            
                            <div className="w-[1px] h-8 bg-white/10"></div>
                            
                            <a href="perfil.html" className="flex flex-col items-center gap-1 group no-underline text-center w-1/3">
                                <i data-lucide="user" className="w-5 h-5 text-white group-hover:text-[#DE4F32] transition-colors"></i>
                                <span className="text-white font-black text-[9px] md:text-[10px] uppercase tracking-wider mt-1">Perfil</span>
                                <span className="text-[#87C5C8] text-[7px] md:text-[8px] uppercase tracking-widest">Ingresar</span>
                            </a>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MapApp />);
    </script>
</body>
</html>
