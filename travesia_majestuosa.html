<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOT MOT - Travesía Majestuosa</title>
    <!-- Bibliotecas externas -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap');
        
        :root { 
            --orange: #DE4F32; 
            --teal: #87C5C8; 
            --dark: #020617; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark); 
            color: white; 
            margin: 0; 
            overflow: hidden; 
        }

        .font-trek { font-family: 'Syncopate', sans-serif; }
        
        /* Layout Principal */
        .main-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        @media (min-width: 1024px) { .main-container { flex-direction: row; } }
        
        /* Sección Mapa: Estable y Responsivo */
        .map-section { 
            height: 45vh; /* Un poco más de altura en móvil para ver bien el mapa */
            width: 100%; 
            position: relative; 
            background: #EBE5D9; 
            flex-shrink: 0;
            overflow: hidden;
        }
        @media (min-width: 1024px) { 
            .map-section { height: 100vh; width: 50%; border-right: 1px solid rgba(255,255,255,0.1); } 
        }
        
        /* Área de Contenido */
        .content-section { 
            flex-grow: 1; 
            overflow-y: auto; 
            scroll-snap-type: y mandatory; 
            background: var(--dark);
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .content-section::-webkit-scrollbar { display: none; }

        .stage-card { 
            scroll-snap-align: start; 
            min-height: 55vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 2rem;
            position: relative;
        }
        @media (min-width: 1024px) { .stage-card { min-height: 100vh; padding: 10% 12%; } }

        /* Efectos Visuales del SVG */
        .active-glow { filter: drop-shadow(0 0 6px rgba(222, 79, 50, 0.7)); }
        
        /* Animación de dibujo de la ruta arreglada */
        .path-draw {
            stroke-dasharray: 150;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
        }

        /* Tus Animaciones Fade-Up */
        .fade-up { transition: all 0.8s ease-out; }
        .is-hidden { opacity: 0; transform: translateY(30px); filter: blur(5px); }
        .is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* Datos precisos del mapa ajustados a la Imagen 3 */
        const routeData = [
            { 
                id: 'zapatoca', level: 1, title: "Zapatoca", subtitle: "Ciudad Levítica", 
                alt: 1787, dist: "0km", diff: "Media-Alta", path: "Lengerke",
                desc: "Donde el tiempo se detiene a 1.787 msnm.",
                fullText: "Caminamos por la historia. Los senderos tallados por Lengerke nos guían en este primer contacto con la piedra santandereana.",
                mapX: 35, mapY: 25, chartX: 0, anchor: "middle", labelY: -5, labelX: 0,
                segmentPath: ""
            },
            { 
                id: 'la-fuente', level: 2, title: "La Fuente", subtitle: "Desvío Río Suárez", 
                alt: 1270, dist: "20km", diff: "Media", path: "Comunitario",
                desc: "Descenso técnico hacia el rumor del agua.",
                fullText: "El Puente de Ruedas marca el punto más bajo antes de subir nuevamente. La humedad del río cambia el aroma del aire.",
                mapX: 30, mapY: 55, chartX: 16, anchor: "end", labelX: -3, labelY: 0,
                segmentPath: "M 35 25 Q 32 40, 30 55"
            },
            { 
                id: 'guane', level: 3, title: "Guane", subtitle: "Refugio Ancestral", 
                alt: 885, dist: "33.8km", diff: "Baja", path: "Piedra",
                desc: "Tierra de fósiles y silencio indígena.",
                fullText: "Cada piedra aquí cuenta una historia de millones de años. Guane nos recibe con su plaza colonial intacta.",
                mapX: 45, mapY: 70, chartX: 33, anchor: "end", labelX: -3, labelY: 2,
                segmentPath: "M 30 55 Q 35 65, 45 70"
            },
            { 
                id: 'barichara', level: 4, title: "Barichara", subtitle: "Pueblo de Piedra", 
                alt: 1336, diff: "Baja", path: "Vía Real",
                desc: "El corazón amarillo de la travesía.",
                fullText: "Arquitectura que respira. Barichara es el refugio necesario antes de enfrentar la profundidad del cañón.",
                mapX: 55, mapY: 85, chartX: 50, anchor: "middle", labelY: 6, labelX: 0,
                segmentPath: "M 45 70 Q 50 80, 55 85"
            },
            { 
                id: 'villanueva', level: 5, title: "Villanueva", subtitle: "Ruta del Ocre", 
                alt: 1450, diff: "Alta", path: "Real Recuperado",
                desc: "Cafetales y minas bajo el sol santandereano.",
                fullText: "La tierra cambia a colores intensos. Es la última zona de frescura antes del descenso crítico.",
                mapX: 70, mapY: 70, chartX: 66, anchor: "middle", labelY: 6, labelX: 0,
                segmentPath: "M 55 85 Q 65 80, 70 70"
            },
            { 
                id: 'jordan', level: 6, title: "Jordán", subtitle: "Fondo del Abismo", 
                alt: 425, diff: "Extrema", path: "Técnico",
                desc: "El pueblo que el mundo olvidó.",
                fullText: "Aquí el Chicamocha impone su ley. 35°C y el silencio más profundo de Colombia.",
                mapX: 85, mapY: 55, chartX: 83, anchor: "middle", labelX: 0, labelY: 6,
                segmentPath: "M 70 70 Q 78 65, 85 55"
            },
            { 
                id: 'los-santos', level: 7, title: "Los Santos", subtitle: "El Gran Muro", 
                alt: 1310, diff: "Alta", path: "El Muro",
                desc: "La conquista vertical del Geoparque.",
                fullText: "1.000 metros de ascenso directo. Coronar la Mesa de Los Santos es el premio final a la resistencia.",
                mapX: 80, mapY: 40, chartX: 100, anchor: "middle", labelX: 0, labelY: -4,
                segmentPath: "M 85 55 Q 88 45, 80 40"
            }
        ];

        const App = () => {
            const [activeIndex, setActiveIndex] = useState(0);
            const [showModal, setShowModal] = useState(null);
            const scrollRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                setActiveIndex(parseInt(entry.target.dataset.index));
                            }
                        });
                    }, { threshold: 0.6, rootMargin: "-10% 0px -10% 0px" }
                );
                document.querySelectorAll('.stage-card').forEach(card => observer.observe(card));
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [activeIndex, showModal]);

            const activeNode = routeData[activeIndex];

            return (
                <div className="main-container">
                    
                    {/* IZQUIERDA: MAPA ESTABLE (Sin transformaciones raras) */}
                    <div className="map-section shadow-[20px_0_40px_rgba(0,0,0,0.3)]">
                        <div className="absolute top-6 left-6 z-30">
                            <h1 className="font-trek text-[#DE4F32] text-2xl tracking-tighter">MOT MOT</h1>
                            <div className="h-0.5 w-12 bg-slate-800 mt-1"></div>
                        </div>

                        {/* ViewBox ampliado a "-10 -10 120 120" para que no se corten las letras en los bordes */}
                        <svg viewBox="-10 -10 120 120" className="w-full h-full z-10 absolute inset-0 pt-8 pb-4">
                            
                            {/* 1. Líneas base tenues */}
                            {routeData.map((node, i) => (
                                <path key={`bg-${i}`} d={node.segmentPath} fill="none" stroke="#94a3b8" strokeWidth="0.5" strokeDasharray="1 1" />
                            ))}

                            {/* 2. Líneas activas animadas (Dibujo progresivo arreglado) */}
                            {routeData.map((node, i) => (
                                <path 
                                    key={`active-${i}`} 
                                    d={node.segmentPath} 
                                    fill="none" 
                                    stroke="#DE4F32" 
                                    strokeWidth="1.2" 
                                    className="path-draw"
                                    style={{ 
                                        opacity: i <= activeIndex ? 1 : 0, 
                                        strokeDashoffset: i <= activeIndex ? '0' : '150' 
                                    }}
                                />
                            ))}

                            {/* 3. Nodos y Nombres */}
                            {routeData.map((node, i) => (
                                <g key={node.id}>
                                    <circle 
                                        cx={node.mapX} cy={node.mapY} 
                                        r={i === activeIndex ? "2.5" : "1.2"} 
                                        fill={i <= activeIndex ? "#DE4F32" : "#94a3b8"} 
                                        className={`transition-all duration-700 ${i === activeIndex ? 'active-glow' : ''}`}
                                    />
                                    {i === activeIndex && (
                                        <circle cx={node.mapX} cy={node.mapY} r="4" fill="#DE4F32" className="animate-ping opacity-30" />
                                    )}
                                    <text 
                                        x={node.mapX + node.labelX} 
                                        y={node.mapY + node.labelY} 
                                        textAnchor={node.anchor}
                                        className={`text-[3.5px] font-black uppercase tracking-tighter transition-all duration-700 ${i === activeIndex ? 'fill-slate-900 scale-100 opacity-100' : 'fill-slate-400 scale-95 opacity-50'}`}
                                    >
                                        {node.title}
                                    </text>
                                </g>
                            ))}
                        </svg>

                        {/* ALTIMETRÍA Y HUD */}
                        <div className="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-white via-white/95 to-transparent z-40">
                            <div className="flex justify-between items-end mb-2">
                                <div>
                                    <p className="text-[10px] font-trek text-slate-400 mb-1 uppercase">Altitud Actual</p>
                                    <span className="text-3xl md:text-4xl font-black text-slate-900">{activeNode.alt}</span>
                                    <span className="text-xs md:text-sm ml-1 text-slate-600 font-normal">msnm</span>
                                </div>
                                <div className={`px-2 py-1 md:px-3 md:py-1.5 rounded-full text-[7px] md:text-[9px] font-black uppercase tracking-wider transition-colors duration-500 ${activeNode.alt < 600 ? 'bg-red-100 text-red-600 border border-red-200 shadow-sm animate-pulse' : 'bg-teal-50 text-teal-700 border border-teal-100'}`}>
                                    {activeNode.alt < 600 ? '⚠️ Zona Térmica Crítica' : 'Clima de Montaña'}
                                </div>
                            </div>
                            
                            <div className="h-8 md:h-12 w-full relative">
                                <svg viewBox="0 0 100 20" preserveAspectRatio="none" className="w-full h-full opacity-30 drop-shadow-md">
                                    <path d="M 0 20 L 0 1 L 16 6 L 25 15 L 33 10 L 50 5 L 66 4 L 83 15 L 100 5 L 100 20 Z" fill="#DE4F32" />
                                    <line x1={activeNode.chartX} y1="0" x2={activeNode.chartX} y2="20" stroke="#DE4F32" strokeWidth="0.8" strokeDasharray="1.5" className="transition-all duration-700 ease-in-out" />
                                    <circle cx={activeNode.chartX} cy="0" r="1.5" fill="#DE4F32" className="transition-all duration-700 ease-in-out" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    {/* DERECHA: CONTENIDO NARRATIVO */}
                    <div className="content-section" ref={scrollRef}>
                        {routeData.map((node, i) => (
                            <section key={node.id} data-index={i} className="stage-card">
                                <div className={`fade-up ${i === activeIndex ? 'is-visible' : 'is-hidden'}`}>
                                    
                                    <div className="flex items-center gap-4 mb-4">
                                        <span className="text-[#DE4F32] font-trek text-xs tracking-[0.4em]">0{node.level}</span>
                                        <div className="h-px w-full bg-white/10"></div>
                                    </div>
                                    
                                    {/* Ajuste de tamaño de texto para móviles (text-4xl en lugar de text-5xl) */}
                                    <h2 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-black uppercase leading-none tracking-tighter mb-4 break-words">
                                        {node.title}
                                    </h2>
                                    <p className="text-[#87C5C8] font-bold text-xs sm:text-sm uppercase tracking-[0.2em] mb-8">{node.subtitle}</p>
                                    
                                    <div className="flex gap-8 mb-10 overflow-x-auto pb-2">
                                        <div className="flex-shrink-0">
                                            <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Dificultad</p>
                                            <p className="text-base sm:text-lg font-bold text-[#DE4F32]">{node.diff}</p>
                                        </div>
                                        <div className="flex-shrink-0">
                                            <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Suelo</p>
                                            <p className="text-base sm:text-lg font-bold">{node.path}</p>
                                        </div>
                                    </div>

                                    <p className="text-lg sm:text-xl md:text-2xl text-slate-300 leading-relaxed font-light mb-10 italic">
                                        "{node.desc}"
                                    </p>

                                    <button 
                                        onClick={() => setShowModal(node)}
                                        className="group flex items-center gap-4 border border-white/20 px-6 py-3 sm:px-8 sm:py-4 rounded-full hover:bg-white hover:text-black transition-all w-max"
                                    >
                                        <span className="text-[10px] font-trek tracking-widest">VER DETALLES</span>
                                        <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-2 transition-transform"></i>
                                    </button>
                                </div>
                            </section>
                        ))}
                        <div className="h-[20vh] flex items-center justify-center">
                            <p className="text-slate-600 font-trek text-[10px] tracking-widest uppercase">MOT MOT - Fin de Ruta</p>
                        </div>
                    </div>

                    {/* MODAL DE FICHA TÉCNICA */}
                    {showModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl" onClick={() => setShowModal(null)}>
                            <div className="bg-slate-900 border border-white/10 w-full max-w-2xl rounded-[2rem] sm:rounded-[3rem] p-6 sm:p-8 md:p-12 relative shadow-2xl" onClick={e => e.stopPropagation()}>
                                
                                <button onClick={() => setShowModal(null)} className="absolute top-4 right-4 sm:top-8 sm:right-8 text-slate-500 hover:text-white transition-colors">
                                    <i data-lucide="x" className="w-6 h-6 sm:w-8 sm:h-8"></i>
                                </button>
                                
                                <h3 className="text-[#DE4F32] font-trek text-[10px] mb-4 tracking-[0.3em]">ANÁLISIS TÉCNICO</h3>
                                <h2 className="text-3xl sm:text-4xl md:text-6xl font-black uppercase mb-6 sm:mb-8 pr-10">{showModal.title}</h2>
                                <p className="text-slate-300 text-base sm:text-lg md:text-xl leading-relaxed mb-8 sm:mb-10 italic">"{showModal.fullText}"</p>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="bg-white/5 p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-white/5">
                                        <p className="text-[#87C5C8] text-[10px] font-trek mb-2 tracking-widest">CLIMA</p>
                                        <p className="text-xs sm:text-sm text-slate-400">Variación térmica extrema según altitud ({showModal.alt} msnm). Hidratación constante requerida.</p>
                                    </div>
                                    <div className="bg-[#DE4F32] p-4 sm:p-6 rounded-2xl sm:rounded-3xl flex flex-col justify-between shadow-lg">
                                        <p className="text-white text-[10px] font-trek tracking-widest">EQUIPO</p>
                                        <p className="text-white font-bold text-xs sm:text-sm">Botas Pro + Bastones</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
